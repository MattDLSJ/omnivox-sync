# The name of this term. It becomes part of your folder path and of every
# notebook name, so write it however you would say it. Leave it EMPTY and it
# is worked out from today's date, which is what you want unless you have a
# preference: a hardcoded one is correct for a few months and then quietly
# wrong, and an install in January would file a winter semester into a folder
# named after the autumn.
semester: ""

# NOTE: existing folders on this Mac use English season names
# ("Cegep Fall 2025", "Cegep Winter 2026", "Cegep Summer 2026").
# The spec specifies "Cegep Automne 2026". The fall folder does not exist yet,
# so either works — omnivox_sync creates it. Change this one line if you
# prefer to match the existing English convention.
base_path: "~/Documents/School/Cegep Automne 2026"

# Filled by: .venv/bin/python -m src.omnivox_sync --discover
courses: []

# Filled once the timetable is published (Milestone 4). M4 is inert while empty.
schedule: []

# --------------------------------------------------------------------------
# Which Omnivox this account is on.
#
# Omnivox is one product, sold to nearly every cégep in Quebec, so the login
# form, the page names and the CSS are identical everywhere. Only the hostname
# differs, and it follows a pattern: log into your portal and read the address
# bar. If it says https://cegepmontpetit.omnivox.ca then your portal is
# "cegepmontpetit". Leave it empty to use that one.
school:
  portal: ""

  # For a school whose hostname does not follow the pattern, set these two
  # outright instead. They are different origins and must not be swapped:
  # resolving a LÉA path against the portal is a 404 on every course.
  home: ""    # e.g. https://cegepmontpetit.omnivox.ca
  lea: ""     # e.g. https://cegepmontpetit-lea.omnivox.ca

  # The scraper navigates by clicking visible text, so it speaks French by
  # default. An English-language college on the same Omnivox needs these, and
  # nothing else in the project changes. docs_nav is a "|"-separated list of
  # the names that page has gone by.
  labels: {}
  #   docs_link: "Documents and videos"
  #   travaux_link: "Distributed assignments"
  #   docs_nav: "Distributed documents|Documents and videos|Documents"
  #   lea_link_name: "Léa"
  #   logged_in_text: "What's new"

notify:
  macos: true
  # Phone push goes through ntfy.sh. The topic name is the only thing guarding
  # it, so it lives in .env as NTFY_TOPIC and this stays empty. Empty in both
  # places = Mac notifications only.
  ntfy_topic: ""

digest:
  ranking: "rules"      # "rules" | "gemini"
  folder: "Other"       # subfolder for _digest.md; "" puts it at the top level

# Cosmetic Finder presentation, applied to each course folder as it is created.
# Each course may carry an "icon:" -- an emoji, or "sym:<sf-symbol>".
finder:
  tag: "School"
  color: "green"        # none|gray|green|purple|blue|yellow|red|orange

notebooklm:
  # "auto"     upload into the notebook named for this course in courses:
  # "staging"  copy new files to <course>/_to_upload/ and drag them in yourself
  # "off"      do not do any of this; you do not use NotebookLM
  mode: "auto"

# Fast-forward to the latest release at the start of each scheduled sync, so
# fixes arrive without anyone having to remember `make update`. It refuses to
# touch a copy that has its own changes, and says so rather than discarding
# them, so it cannot eat a fix you made locally.
update:
  auto: true

# When the scheduled sync runs. Written as HH:MM, comma separated; a YAML list
# works too if you prefer. `make settings` offers the usual choices.
# Changing this needs `make install-launchd` again to take effect, because
# launchd holds its own copy of the schedule.
sync_times: "07:30, 12:15, 18:30"

at_school_check: "off"  # "off" | "ip" | "ssid"
school_ip_prefix: ""
school_ssid: ""         # Wi-Fi name that means "on campus"; used when at_school_check = "ssid"

# GPS gate for the recorder: it only records when the Mac is inside this circle.
# Leave lat/lon at 0 to disable it and record wherever you are.
school_location:
  lat: 0.0
  lon: 0.0
  radius_m: 400

# --------------------------------------------------------------------------
# Recording and transcription (M4). All of this is inert while schedule: is [].
# --------------------------------------------------------------------------

# Where audio and transcripts land. Relative (like this) = a subfolder inside
# EACH course folder, so a class's recordings sit next to that class's slides.
# Absolute, or starting with ~ = one root of its own, courses nested under it.
recordings_folder: "2_Voice"

# Same rule, for pages pulled out of the i+ Interactif digital textbooks.
books_folder: "3_Livres"

# Where teacher announcements are saved, one Markdown file each, beside the
# course documents so they reach NotebookLM through the same queue. A
# communiqué is where instructions like "se procurer l'ouvrage à la COOP"
# actually live, and nothing else in this project ever read one.
communiques_folder: "4_Communiques"

# Substring of the input device name, as shown in System Settings > Sound.
# Empty = the system default input.
microphone: ""

transcribe: true              # run whisper.cpp on each finished recording
transcribe_language: "auto"   # "auto" | a single code like "fr"
transcribe_languages: ["fr", "en"]  # the languages "auto" is allowed to pick
transcribe_timestamps: true   # keep [mm:ss] marks in the transcript
whisper_model: ""             # path to a ggml model; empty = large-v3-turbo
live_transcribe: true         # transcribe each minute as it is captured
whisper_vad: true             # skip silence with Silero VAD (make fetch-vad)
whisper_vad_model: ""         # path to the VAD model; empty = the fetched one
upload_transcript: true       # send the .md transcript to NotebookLM too

# --------------------------------------------------------------------------
# Term dates. The recorder stays quiet outside them and on days off.
# --------------------------------------------------------------------------
semester_start: "2026-08-24"
semester_end: "2026-12-09"
no_class_days: []
